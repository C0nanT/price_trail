<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="page">
  <h1 class="mb-4 text-2xl font-bold leading-tight">Entrar</h1>
  <form id="form" class="grid gap-3">
    <label class="grid gap-2">
      <span class="text-sm font-semibold">Usuário</span>
      <input id="username" name="username" class="field" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="grid gap-2">
      <span class="text-sm font-semibold">Senha</span>
      <input id="password" name="password" type="password" class="field" autocomplete="current-password" required>
    </label>
    <button id="send" type="submit" class="btn btn-primary w-full md:w-auto md:justify-self-start">Entrar</button>
  </form>
  <p id="error" class="alert mt-3" role="alert" hidden></p>
</main>
<script src="/static/login/app.js"></script>
</body>
</html>
