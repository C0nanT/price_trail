<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de compras</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav aria-label="Principal" class="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-surface md:static md:border-b md:border-t-0" style="padding-bottom: env(safe-area-inset-bottom)">
  <div class="mx-auto grid max-w-4xl grid-cols-4 md:flex md:gap-2 md:px-4">
    <a href="/" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Gráfico</a>
    <a href="/groups" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Agrupar</a>
    <a href="/import" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Importar</a>
    <a href="/lista" aria-current="page" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Lista</a>
  </div>
</nav>
<main class="page">
  <div class="flex items-start justify-between gap-3">
    <h1 class="mb-1 text-2xl font-bold leading-tight">Lista de compras</h1>
    <button type="button" data-logout class="inline-flex min-h-touch shrink-0 items-center px-3 text-sm font-semibold text-muted underline hover:text-ink">Sair</button>
  </div>
  <p class="mb-4 text-sm text-muted">Preço médio das notas desde <span id="since">…</span> (6 meses). As marcações são compartilhadas entre os aparelhos e atualizam a cada 10 segundos.</p>
  <p id="error" class="alert mb-4" role="alert" hidden></p>
  <div class="sticky top-0 z-[5] -mx-4 mb-4 flex items-center justify-between gap-3 border-b border-line bg-surface px-4 py-2">
    <p id="progress" class="text-lg font-semibold" role="status" aria-live="polite"></p>
    <div class="flex gap-2">
      <button id="refresh" type="button" class="btn">Atualizar <span id="countdown" class="tabular-nums text-muted"></span></button>
      <button id="reset" type="button" class="btn">Desmarcar tudo</button>
    </div>
  </div>
  <div id="sections" class="grid gap-6"></div>
</main>
<script src="/static/common.js"></script>
<script src="/static/lista/app.js"></script>
</body>
</html>
