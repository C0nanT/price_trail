<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importar notas</title>
<link rel="stylesheet" href="/static/import/style.css">
</head>
<body>
<main>
  <h1>Importar notas</h1>
  <p class="nav"><a href="/">Ver gráfico</a> · <a href="/groups">Agrupar produtos</a></p>
  <form id="form">
    <label>PDFs de NFC-e <input id="files" name="files" type="file" multiple accept="application/pdf,.pdf"></label>
    <button id="send" type="submit">Enviar</button>
    <span id="status" role="status" aria-live="polite"></span>
  </form>
  <p id="error" class="warn" role="alert" hidden></p>
  <section id="result" hidden>
    <p id="summary"></p>
    <table>
      <thead><tr><th>Arquivo</th><th>Resultado</th><th>Detalhe</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/import/app.js"></script>
</body>
</html>
