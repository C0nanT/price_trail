<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Histórico de preços</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav aria-label="Principal" class="fixed inset-x-0 bottom-0 z-10 border-t border-line bg-surface md:static md:border-b md:border-t-0" style="padding-bottom: env(safe-area-inset-bottom)">
  <div class="mx-auto grid max-w-4xl grid-cols-3 md:flex md:gap-2 md:px-4">
    <a href="/" aria-current="page" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Gráfico</a>
    <a href="/groups" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Agrupar</a>
    <a href="/import" class="flex min-h-touch items-center justify-center px-4 text-sm font-semibold text-muted hover:text-ink aria-[current=page]:text-accent aria-[current=page]:underline">Importar</a>
  </div>
</nav>
<main class="page">
  <h1 class="mb-4 text-2xl font-bold leading-tight">Histórico de preços</h1>
  <div class="grid gap-3 md:grid-cols-2">
    <label class="grid gap-1 text-sm text-muted">Buscar <input id="search" type="search" placeholder="Ex.: tomate" autocomplete="off" class="field"></label>
    <label class="grid gap-1 text-sm text-muted">Produto <select id="product" class="field"></select></label>
  </div>
  <details id="filters" open class="md:[&::details-content]:![content-visibility:visible] mt-3 rounded-lg border border-line md:border-0 [&_summary::-webkit-details-marker]:hidden">
    <summary class="flex min-h-touch cursor-pointer list-none items-center justify-between px-3 font-semibold md:hidden">
      <span>Filtros</span>
      <span id="filter-count" class="badge bg-raised text-muted" aria-live="polite">0 ativos</span>
    </summary>
    <div class="grid gap-3 border-t border-line p-3 sm:grid-cols-2 md:grid-cols-3 md:border-0 md:px-0 md:pb-0">
      <label class="grid gap-1 text-sm text-muted">Categoria <select id="category" class="field"></select></label>
      <label class="grid gap-1 text-sm text-muted">Estabelecimento <select id="store" class="field"></select></label>
      <label class="grid gap-1 text-sm text-muted">Ordenar por
        <select id="sort" class="field">
          <option value="purchases">Mais compras</option>
          <option value="name">Nome</option>
          <option value="rise">Maior alta</option>
          <option value="drop">Maior queda</option>
        </select>
      </label>
      <label class="grid gap-1 text-sm text-muted">De <input id="from" type="date" class="field"></label>
      <label class="grid gap-1 text-sm text-muted">Até <input id="to" type="date" class="field"></label>
    </div>
  </details>
  <section id="details" class="mt-6" hidden>
    <h2 id="title" class="break-words text-xl font-bold leading-snug"></h2>
    <p class="mt-1 text-sm text-muted" id="subtitle"></p>
    <p class="variation mt-1 text-sm font-semibold tabular-nums [&.up]:text-up [&.down]:text-down [&.flat]:text-muted [&_small]:font-normal [&_small]:text-muted" id="variation"></p>
    <div class="my-4 grid grid-cols-2 items-end gap-3 rounded-lg border border-line bg-raised p-3 md:grid-cols-[auto_12rem_1fr] md:gap-5">
      <div class="text-sm text-muted">Média dos preços <strong id="average" class="block text-2xl text-ink tabular-nums"></strong></div>
      <label class="grid gap-1 text-sm text-muted">Preço atual (R$) <input id="current" inputmode="decimal" placeholder="Ex.: 7,99" autocomplete="off" class="field"></label>
      <div id="verdict" aria-live="polite" class="col-span-2 min-w-0 text-lg font-bold md:col-span-1 [&_small]:block [&_small]:text-sm [&_small]:font-normal [&_small]:text-muted"></div>
    </div>
    <div id="chart" class="relative h-72 touch-pan-y md:h-80"><div id="tooltip" hidden><strong></strong><span></span><span></span></div></div>
    <ul id="cards" class="mt-6 grid gap-2 md:hidden"></ul>
    <div class="mt-6 hidden md:block">
      <table class="w-full border-collapse text-sm">
        <thead>
          <tr class="text-left text-muted">
            <th class="border-b border-line py-2 pr-3 font-medium">Data</th><th class="border-b border-line py-2 pr-3 font-medium">Loja</th><th class="border-b border-line py-2 pr-3 text-right font-medium">Preço</th>
            <th class="border-b border-line py-2 pr-3 text-right font-medium">Quantidade</th><th class="border-b border-line py-2 text-right font-medium">Total</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="mt-4 text-sm text-muted">Preços como impressos na nota. Descontos no total da compra não estão incluídos.</p>
  </section>
  <p id="empty" class="mt-6 rounded-lg border border-dashed border-line p-4 text-center text-muted" hidden>Nenhum produto encontrado com esses filtros. Limpe a busca ou os filtros.</p>
  <p id="error" class="alert mt-3" role="alert" hidden></p>
</main>
<script src="/static/common.js"></script>
<script src="/static/chart/app.js"></script>
</body>
</html>
