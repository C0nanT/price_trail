# Testa e publica a imagem de produção em ghcr.io/c0nant/price_trail.
# Só publica: quem faz o deploy é o cron da VPS.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Nome em minúsculas: o GHCR recusa maiúsculas no nome da imagem.
  IMAGE: ghcr.io/c0nant/price_trail

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mesma linha de Python da imagem (python:3.12.x-slim no Dockerfile).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: python -m pip install -r requirements.txt

      # Igual ao `make test`; o pdftotext é simulado, não precisa de poppler.
      - name: Roda a suíte
        run: python -m unittest discover -s tests -t .

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
